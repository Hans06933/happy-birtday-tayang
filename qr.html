<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Happy Birthday Tayang</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e5,
            #ff9fc2
        );

}

.card {

    background: white;

    padding: 35px;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(100,0,40,.2);

}

h1 {

    font-family: Georgia, serif;

    color: #d82f6d;

}

.qr-heart {

    position: relative;

    width: 270px;

    height: 270px;

    margin: 30px auto;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* HEART BACKGROUND */

.qr-heart::before {

    content: "♥";

    position: absolute;

    font-size: 310px;

    line-height: 1;

    color: #ffb1cb;

    z-index: 0;

}


/* QR */

#qrcode {

    position: relative;

    z-index: 2;

    background: white;

    padding: 12px;

    border-radius: 12px;

}

.text {

    color: #7c4158;

    line-height: 1.6;

}

</style>

</head>

<body>


<div class="card">

    <h1>
        Happy Birthday Tayang ❤️
    </h1>

    <div class="qr-heart">

        <div id="qrcode"></div>

    </div>

    <p class="text">

        Scan this ❤️

        <br>

        Ada sesuatu untuk kamu...

    </p>

</div>


<script>

// GANTI DENGAN LINK WEBSITE KAMU

const website =
"https://USERNAME.github.io/happy-birthday-asiya/";


new QRCode(
    document.getElementById("qrcode"),
    {
        text: website,

        width: 200,

        height: 200,

        colorDark: "#9d2451",

        colorLight: "#ffffff",

        correctLevel:
            QRCode.CorrectLevel.H
    }
);

</script>


</body>

</html>
